services:
  web-dev:
    image: node:22-alpine
    container_name: abang-cebu-ai-dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
